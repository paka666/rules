name: Update srs rules daily

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
#  push:
#    branches:
#      - main
#    paths:
#      - '.github/workflows/update-srs-files.yml'
#      - 'srs/merge-srs.sh'
#      - 'srs/json/**/*.json'
#      - 'srs/*.srs'

jobs:
  merge:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ALL }}
          ref: ${{ github.head_ref }}

#      - name: Mkdir
#        run: |
#          mkdir -p temp srs srs/json srs/json/common srs/json/source srs/json/subset

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
#          cache: 'pip'
#          cache-dependency-path: '**/requirements.txt'

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq  #libre2-dev

      - name: Install sing-box
        run: |
          curl -fsSL https://sing-box.app/install.sh | sh

#      - name: Install Python dependencies
#        run: |
#          python -m pip install --upgrade pip
#          pip install -r py/requirements.txt

      - name: Run merge script
        run: |
          chmod +x srs/merge-srs.sh
          bash srs/merge-srs.sh

      - name: Upload Artifacts (Logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: srs/logs/

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[auto] chore: update srs rules daily"
          file_pattern: "srs/*.srs srs/json/**/*.json"
          skip_dirty_check: false
          skip_fetch: true
