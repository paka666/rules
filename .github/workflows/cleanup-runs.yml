name: Weekly cleanup of workflow runs

on:
  schedule:
    - cron: '0 0 * * 0'  # Runs every Sunday at 00:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30  # Retain runs from the last 30 days; adjust as needed
          keep_minimum_runs: 6  # Keep at least 6 recent runs per workflow; adjust as needed
          dry_run: false  # Set to true for testing without actual deletion
