name: Update trackers daily

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
#  push:
#    branches:
#      - main
#    paths:
#      - '.github/workflows/update-trackers.yml'
#      - 'py/update_trackers.py'
#      - 'trackers/*.txt'
#      - 'trackers/*.bak'

jobs:
  update-trackers:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create directory
        run: |
          mkdir -p trackers

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libre2-dev
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r py/requirements.txt

      - name: Update trackers
        run: python py/update_trackers.py

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[auto] chore: update trackers daily"
          file_pattern: "trackers/*.txt trackers/*.bak"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
