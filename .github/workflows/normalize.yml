name: Normalize files (UTF-8 + LF)

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  normalize:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ALL }}

      - name: Set Git config
        run: |
          git config --global core.autocrlf input
          git config --global core.eol lf
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure .gitattributes exists (Idempotent)
        run: |
          touch .gitattributes
          grep -qxF '* text eol=lf' .gitattributes || echo '* text eol=lf' >> .gitattributes
          grep -qxF '*.png binary' .gitattributes || echo '*.png binary' >> .gitattributes
          grep -qxF '*.jpg binary' .gitattributes || echo '*.jpg binary' >> .gitattributes
          grep -qxF '*.gif binary' .gitattributes || echo '*.gif binary' >> .gitattributes
          grep -qxF '*.pdf binary' .gitattributes || echo '*.pdf binary' >> .gitattributes
          grep -qxF '*.zip binary' .gitattributes || echo '*.zip binary' >> .gitattributes
          grep -qxF '*.jar binary' .gitattributes || echo '*.jar binary' >> .gitattributes
          grep -qxF '*.exe binary' .gitattributes || echo '*.exe binary' >> .gitattributes
          grep -qxF '*.12-r36 binary' .gitattributes || echo '*.12-r36 binary' >> .gitattributes

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libre2-dev dos2unix enca file uchardet parallel
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r py/requirements.txt

      - name: Normalize text files to UTF-8 + LF
        shell: bash
        run: |
          echo "🔍 Determining scan scope based on trigger..."
          files=()
          fixed_files=()
          scan_list=()
          trigger="${{ github.event_name }}"
          if [ "$trigger" = "push" ]; then
            echo "📥 Push detected: Scanning only changed files in this push."
            git diff --name-only ${{ github.event.before }} ${{ github.event.after }} > changed_files.txt 2>/dev/null || {
              echo "⚠️ Could not get push diff (e.g., force push?), falling back to last commit diff."
              git diff --name-only HEAD~1 HEAD > changed_files.txt 2>/dev/null || {
                echo "⚠️ Could not get last commit diff, falling back to full scan."
                git ls-files > changed_files.txt
              }
            }
            while IFS= read -r f; do
              if [ -f "$f" ]; then
                scan_list+=("$f")
              fi
            done < changed_files.txt
            rm -f changed_files.txt
          else
            echo "🛠️ Manual/scheduled run: Scanning entire repository."
            # 使用 find -print0 和 read -d $'\0' 来安全处理包含空格或特殊字符的文件名
            while IFS= read -r -d $'\0' f; do
              scan_list+=("$f")
            done < <(find . -type f \
              -not -path "./.git/*" \
              -not -path "./node_modules/*" \
              -not -path "./venv/*" -print0)
          fi
          echo "📂 Files to scan: ${#scan_list[@]}"

          # 定义处理单个文件的函数(支持并行)
          process_file() {
            local f="$1"
            local mime=$(file -bi "$f" 2>/dev/null || true)

            # 跳过非文本文件和可执行文件
            if [ -z "$mime" ] || ! echo "$mime" | grep -q "text/" || file "$f" | grep -q "executable"; then
              return
            fi

            # 综合检测编码：uchardet 主，fallback enca&chardet带置信度
            local encoding=$(uchardet "$f" 2>/dev/null | tr -d ' ' | tr '[:upper:]' '[:lower:]')

            # 清理和标准化编码名称
            if [ -n "$encoding" ]; then
              case "$encoding" in
                "ascii"|"us-ascii") encoding="us-ascii" ;;
                "utf-8"|"utf8") encoding="utf-8" ;;
                "unknown"|"unknown-8bit") encoding="" ;;
              esac
            fi

            # Fallback 到 enca
            if [ -z "$encoding" ]; then
              encoding=$(enca -L none "$f" 2>/dev/null | grep -oP '(?<=Encoding: ).*' | tr '[:upper:]' '[:lower:]')
              if [ -n "$encoding" ] && echo "$encoding" | grep -qi "unrecognized"; then
                encoding=""
              fi
            fi

            # Fallback 到 chardet (Python) - 使用单行形式避免 YAML 问题
            if [ -z "$encoding" ]; then
              encoding=$(python3 -c 'import chardet, sys; raw = open(sys.argv[1], "rb").read(); result = chardet.detect(raw); print(result["encoding"].lower() if result["confidence"] > 0.7 and result["encoding"] else "")' "$f" 2>/dev/null || echo "")
            fi

            # 如果仍未知，尝试常见编码列表
            if [ -z "$encoding" ]; then
              local possible_encodings=("utf-8" "iso-8859-1" "windows-1252" "cp1252" "windows-1254" "utf-16le" "utf-16be")
              for enc in "${possible_encodings[@]}"; do
                if iconv -f "$enc" -t utf-8//IGNORE "$f" -o /dev/null 2>/dev/null; then
                  encoding="$enc"
                  break
                fi
              done
            fi

            # 最终检查：如果还是无法确定编码，安全跳过
            if [ -z "$encoding" ] || [ "$encoding" = "unknown" ] || [ "$encoding" = "unknown-8bit" ]; then
              echo "⚠️ Skipping $f: Unable to determine encoding reliably." >&2
              return
            fi

            # 如果已经是 UTF-8 或 ASCII，只需规范化行尾
            if [ "$encoding" = "utf-8" ] || [ "$encoding" = "us-ascii" ]; then
              dos2unix -q "$f" 2>/dev/null
              if ! git diff --quiet "$f"; then
                echo "$f"
              fi
              return
            fi

            # 验证编码是否被 iconv 支持(安全检查)
            if ! iconv -l 2>/dev/null | grep -qi "$encoding"; then
              echo "⚠️ Skipping $f: Encoding '$encoding' not supported by iconv." >&2
              return
            fi

            # 转换编码到 UTF-8
            echo "🧩 Converting $f from $encoding → UTF-8" >&2
            if ! iconv -f "$encoding" -t utf-8//IGNORE "$f" -o "$f.tmp" 2>/dev/null; then
              echo "⚠️ Failed to convert $f from $encoding" >&2
              rm -f "$f.tmp"
              return
            fi

            mv "$f.tmp" "$f" || {
              echo "⚠️ Failed to replace $f after conversion" >&2
              return
            }

            # 规范化行尾(LF)
            dos2unix -q "$f" 2>/dev/null

            # 后置验证：检查转换后是否为有效的 UTF-8
            local post_mime=$(file -bi "$f")
            if ! echo "$post_mime" | grep -qE "utf-8|us-ascii"; then
              echo "⚠️ Potential garbled content in $f after conversion (reverting changes)" >&2
              git checkout -- "$f" 2>/dev/null || true
              return
            fi

            # 额外乱码检查：如果文件中有过多替换字符(�)，视为失败
            local replacement_count=$(grep -o '�' "$f" 2>/dev/null | wc -l)
            local total_chars=$(wc -c < "$f")
            if [ "$total_chars" -gt 100 ] && [ "$replacement_count" -gt 0 ]; then
              local percentage=$((replacement_count * 100 / total_chars))
              if [ "$percentage" -gt 5 ]; then
                echo "⚠️ High replacement chars ($percentage%) in $f (reverting)" >&2
                git checkout -- "$f" 2>/dev/null || true
                return
              fi
            fi

            # 如果有变化，标记为 fixed
            if ! git diff --quiet "$f"; then
              echo "$f"
            fi
          }

          export -f process_file

          # 并行处理文件(使用 parallel，限制 jobs 避免 OOM)
          echo "🚀 Processing files in parallel..."
          fixed_files=($(parallel -j4 --halt never process_file ::: "${scan_list[@]}" 2>&1 | grep -v '^⚠️' | grep -v '^🧩' || true))

          if [ ${#fixed_files[@]} -gt 0 ]; then
            echo "✅ Fixed files:"
            for file in "${fixed_files[@]}"; do
              echo "- $file"
            done
            git add "${fixed_files[@]}"
          else
            echo "✅ No files needed fixing."
          fi

      - name: Git commit & push
        run: |
          if ! git diff --cached --quiet; then
            git commit -m "[auto] chore: normalize files to UTF-8 + LF"
            git push
            echo "✅ Normalization done and pushed."
          else
            echo "✅ No issues found; everything already normalized."
          fi

      - name: Handle errors gracefully
        if: failure()
        run: echo "❌ Normalization encountered issues; check logs for details."
