name: Normalize files (UTF-8 + LF)

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  normalize:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ALL }}

      - name: Set Git config
        run: |
          git config --global core.autocrlf input
          git config --global core.eol lf
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure .gitattributes exists (Idempotent&Safe Order)
        run: |
          # 重新生成 .gitattributes 以确保顺序正确：通用 -> 文本 -> 二进制(最高优先级)
          cat > .gitattributes <<EOF
          # --- 默认设置 (最低优先级) ---
          * text eol=lf
          # --- 明确的文本格式 ---
          *.sh text eol=lf
          *.yml text eol=lf
          *.yaml text eol=lf
          *.json text eol=lf
          *.txt text eol=lf
          *.md text eol=lf
          *.py text eol=lf
          *.js text eol=lf
          *.ts text eol=lf
          *.html text eol=lf
          *.css text eol=lf
          *.conf text eol=lf
          *.ini text eol=lf
          # 自定义文本匹配
          *.bak text eol=lf
          *.back text eol=lf
          .gitattributes text eol=lf
          AdGuardHome text eol=lf
          singbox text eol=lf
          # --- 二进制文件 (最高优先级 - 覆盖上面的 * text) ---
          *.png binary
          *.jpg binary
          *.jpeg binary
          *.gif binary
          *.pdf binary
          *.zip binary
          *.tar binary
          *.gz binary
          *.7z binary
          *.exe binary
          *.so binary
          *.dll binary
          *.jar binary
          *.dat binary
          *.srs binary
          # 自定义二进制匹配
          *.12-r36 binary
          sing-box* binary
          EOF
          echo "✅ .gitattributes generated."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libre2-dev dos2unix enca file uchardet parallel
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "py/requirements.txt" ]; then
            pip install -r py/requirements.txt
          else
            pip install chardet
          fi

      - name: Normalize text files to UTF-8 + LF
        shell: bash
        run: |
          # --- 1. 确定扫描范围 ---
          echo "🔍 Determining scan scope based on trigger..." >&2
          files=()
          fixed_files=()
          scan_list=()
          trigger="${{ github.event_name }}"

          if [ "$trigger" = "push" ]; then
            echo "📥 Push detected: Scanning only changed files." >&2
            # 获取差异文件列表
            git diff --name-only ${{ github.event.before }} ${{ github.event.after }} > changed_files.txt 2>/dev/null || \
            git diff --name-only HEAD~1 HEAD > changed_files.txt 2>/dev/null || \
            git ls-files > changed_files.txt

            while IFS= read -r f; do
              if [ -f "$f" ]; then
                scan_list+=("$f")
              fi
            done < changed_files.txt
            rm -f changed_files.txt
          else
            echo "🛠️ Manual/scheduled run: Scanning entire repository." >&2
            while IFS= read -r -d $'\0' f; do
              scan_list+=("$f")
            done < <(find . -type f \
              -not -path "./.git/*" \
              -not -path "./sing-box/ui/*" \
              -not -path "./node_modules/*" \
              -not -path "./venv/*" -print0)
          fi
          echo "📂 Files to scan: ${#scan_list[@]}" >&2

          # --- 2. 定义并行处理函数 ---
          process_file() {
            local f="$1"
            if git check-attr diff "$f" | grep -q ": unset" || \
               git check-attr binary "$f" | grep -q ": set"; then
               return
            fi
            if [[ "$(basename "$f")" == sing-box* ]]; then
               return
            fi
            local mime=$(file -bi "$f" 2>/dev/null || true)
            # 如果不是 text/ 且包含 executable 或 ELF，或者是压缩包，跳过
            if [ -z "$mime" ] || ! echo "$mime" | grep -q "text/" || file "$f" | grep -qE "executable|ELF|archive|compressed"; then
              return
            fi

            # 综合检测编码：uchardet 主，fallback enca&chardet带置信度
            # 1. uchardet
            local encoding=$(uchardet "$f" 2>/dev/null | tr -d ' ' | tr '[:upper:]' '[:lower:]')
            # 清理和标准化编码名称
            if [ -n "$encoding" ]; then
              case "$encoding" in
                "ascii"|"us-ascii") encoding="us-ascii" ;;
                "utf-8"|"utf8") encoding="utf-8" ;;
                "unknown"|"unknown-8bit") encoding="" ;;
              esac
            fi

            # 2. enca (fallback)
            if [ -z "$encoding" ]; then
              encoding=$(enca -L none "$f" 2>/dev/null | grep -oP '(?<=Encoding: ).*' | tr '[:upper:]' '[:lower:]')
              if [ -n "$encoding" ] && echo "$encoding" | grep -qi "unrecognized"; then
                encoding=""
              fi
            fi

            # 3. chardet (python fallback) - 使用单行形式避免 YAML 问题
            if [ -z "$encoding" ]; then
              encoding=$(python3 -c 'import chardet, sys; raw = open(sys.argv[1], "rb").read(); result = chardet.detect(raw); print(result["encoding"].lower() if result["confidence"] > 0.7 and result["encoding"] else "")' "$f" 2>/dev/null || echo "")
            fi

            # 如果仍未知，尝试常见编码列表
            if [ -z "$encoding" ]; then
              local possible_encodings=("utf-8" "gbk" "gb2312" "big5" "iso-8859-1" "windows-1252" "cp1252" "windows-1254" "utf-16le" "utf-16be" "utf-16le")
              for enc in "${possible_encodings[@]}"; do
                if iconv -f "$enc" -t utf-8//IGNORE "$f" -o /dev/null 2>/dev/null; then
                  encoding="$enc"
                  break
                fi
              done
            fi

            # 最终检查：如果还是无法确定编码，安全跳过
            case "$encoding" in
              ""|unknown*)
                echo "⚠️ Skipping $f: Unknown encoding" >&2
                return
                ;;
            esac

            # 如果已经是 UTF-8 或 ASCII，只需规范化行尾
            if [ "$encoding" = "utf-8" ] || [ "$encoding" = "us-ascii" ]; then
              dos2unix -q "$f" 2>/dev/null
              if ! git diff --quiet "$f"; then
                echo "$f"
              fi
              return
            fi

            # 检查 iconv 是否支持该编码
            if ! iconv -l 2>/dev/null | grep -qiE "^$encoding//?$"; then
               # 尝试模糊匹配或者跳过
               if ! iconv -f "$encoding" -t utf-8//IGNORE "$f" -o /dev/null 2>/dev/null; then
                 echo "⚠️ Skipping $f: Encoding '$encoding' not supported by iconv." >&2
                 return
               fi
            fi

            # 转换编码到 UTF-8
            echo "🧩 Converting $f from $encoding → UTF-8" >&2
            if ! iconv -f "$encoding" -t utf-8//IGNORE "$f" -o "$f.tmp" 2>/dev/null; then
              echo "⚠️ Failed to convert $f from $encoding" >&2
              rm -f "$f.tmp"
              return
            fi
            mv "$f.tmp" "$f" || {
              echo "⚠️ Failed to replace $f after conversion" >&2
              return
            }

            # 规范化行尾(LF)
            dos2unix -q "$f" 2>/dev/null

            # 后置验证：检查转换后是否为有效的 UTF-8
            local post_mime=$(file -bi "$f")
            if ! echo "$post_mime" | grep -qE "utf-8|us-ascii"; then
              echo "⚠️ Potential garbled content in $f after conversion (reverting changes)" >&2
              git checkout -- "$f" 2>/dev/null
              return
            fi

            # 额外乱码检查：如果文件中有过多替换字符(�)，视为失败
            local replacement_count=$(grep -o '�' "$f" 2>/dev/null | wc -l)
            local total_chars=$(wc -c < "$f")
            if [ "$total_chars" -gt 100 ] && [ "$replacement_count" -gt 0 ]; then
              local percentage=$((replacement_count * 100 / total_chars))
              if [ "$percentage" -gt 5 ]; then
                echo "⚠️ High replacement chars ($percentage%) in $f (reverting)" >&2
                git checkout -- "$f" 2>/dev/null
                return
              fi
            fi

            # 成功且有变化，输出文件名
            if ! git diff --quiet "$f"; then
              echo "$f"
            fi
          }

          export -f process_file

          # --- 3. 并行处理文件(使用 parallel，限制 jobs 避免 OOM) ---
          echo "🚀 Processing files in parallel..." >&2
          mapfile -t fixed_files < <(parallel -j4 --halt never process_file ::: "${scan_list[@]}" 2> >(grep -v "uchardet" >&2))

          # --- 4. 提交更改 ---
          if [ ${#fixed_files[@]} -gt 0 ]; then
            echo "✅ Fixed files count: ${#fixed_files[@]}" >&2
            # 再次过滤，确保文件存在且不为空
            valid_files=()
            for file in "${fixed_files[@]}"; do
              if [ -n "$file" ] && [ -f "$file" ]; then
                echo "- $file" >&2
                valid_files+=("$file")
              fi
            done
            if [ ${#valid_files[@]} -gt 0 ]; then
              git add "${valid_files[@]}"
            else
              echo "✅ No valid files to add." >&2
            fi
          else
            echo "✅ No files needed fixing." >&2
          fi

      - name: Git commit & push
        run: |
          if ! git diff --cached --quiet; then
            git commit -m "[auto] chore: normalize files to UTF-8 + LF"
            git push
            echo "✅ Normalization done and pushed."
          else
            echo "✅ No issues found; everything already normalized."
          fi

      - name: Handle errors gracefully
        if: failure()
        run: echo "❌ Normalization encountered issues; check logs for details."
