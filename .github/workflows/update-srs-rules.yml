name: Update srs rules daily

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

env:
  LD_LIBRARY_PATH: /lib:/usr/lib

# push:
#   branches:
#     - main
#   paths:
#     - '.github/workflows/update-srs-rules.yml'
#     - 'sing-box/merge-srs.sh'
#     - 'sing-box/json/**/*.json'
#     - 'sing-box/srs/*.srs'

jobs:
  merge:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare log directory
        run: mkdir -p sing-box/logs

      - name: Enable QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          cache-image: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
#         cache: 'pip'
#         cache-dependency-path: '**/requirements.txt'

#     - name: Install Python dependencies
#       run: |
#         python -m pip install --upgrade pip
#         pip install -r py/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq p7zip-full qemu-user-static wget
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install ARM64 musl runtime libraries (dynamic links)
        run: |
          ARCH="aarch64"
          ALPINE_URL="https://dl-cdn.alpinelinux.org/edge/main/${ARCH}"
          echo "⬇️ 正在下载 APK 索引文件..."
          wget -q "${ALPINE_URL}/APKINDEX.tar.gz" -O - | tar -xzf - APKINDEX 2>/dev/null
          get_latest_filename() {
            local package=$1
            grep -A 1 "^P:$package$" APKINDEX | grep "^V:" | head -1 | \
              sed -E "s/^V:(.*)/${package}-\\1.apk/"
          }
          LATEST_MUSL=$(get_latest_filename musl)
          LATEST_LIBGCC=$(get_latest_filename libgcc)
          if [ -z "$LATEST_MUSL" ] || [ -z "$LATEST_LIBGCC" ]; then
            echo "❌ 错误: 无法从 APK 索引中找到 musl 或 libgcc 的最新版本。"
            exit 1
          fi
          echo "✅ 找到最新 musl: $LATEST_MUSL"
          echo "✅ 找到最新 libgcc: $LATEST_LIBGCC"
          echo "⬇️ 下载并安装 musl..."
          wget "${ALPINE_URL}/${LATEST_MUSL}" -O musl.apk
          7z x musl.apk -so | sudo tar -xf - --warning=no-unknown-keyword -C /
          echo "⬇️ 下载并安装 libgcc..."
          wget "${ALPINE_URL}/${LATEST_LIBGCC}" -O libgcc.apk
          7z x libgcc.apk -so | sudo tar -xf - --warning=no-unknown-keyword -C /
          rm APKINDEX musl.apk libgcc.apk
          echo "=== 验证依赖库 ==="
          ls -lh /lib/ld-musl-aarch64.so.1 2>/dev/null || echo "❌ musl 链接器缺失"
          ls -lh /lib/libgcc_s.so.1 2>/dev/null || ls -lh /usr/lib/libgcc_s.so.1 2>/dev/null || echo "❌ libgcc_s 缺失"

      - name: Setup sing-box binary
        run: |
          sudo mkdir -p /usr/local/bin
          sudo cp sing-box/core/sing-box1.12.12-r36 /usr/local/bin/sing-box-arm64
          sudo chmod +x /usr/local/bin/sing-box-arm64
#         curl -fsSL https://sing-box.app/install.sh | sh

      - name: Display sing-box info
        run: |
          echo "=== sing-box 二进制信息 ==="
          file /usr/local/bin/sing-box-arm64
          echo ""
          echo "=== sing-box 动态库依赖 ==="
          readelf -d /usr/local/bin/sing-box-arm64 | grep NEEDED

      - name: Test sing-box with QEMU
        run: |
          echo "=== 测试 sing-box 运行 ==="
          qemu-aarch64-static /usr/local/bin/sing-box-arm64 version

      - name: Create sing-box wrapper script
        run: |
          sudo tee /usr/local/bin/sing-box > /dev/null <<'EOF'
          #!/bin/bash
          # Wrapper script to run ARM64 musl sing-box with QEMU
          exec qemu-aarch64-static /usr/local/bin/sing-box-arm64 "$@"
          EOF
          sudo chmod +x /usr/local/bin/sing-box

      - name: Verify sing-box wrapper
        run: |
          echo "=== 验证 sing-box 版本 ==="
          sing-box version

      - name: Run merge script
        id: run_script
        run: |
          chmod +x sing-box/merge-srs.sh
          bash sing-box/merge-srs.sh

      - name: Commit on Success
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[auto] chore: update srs rules daily"
          file_pattern: "sing-box/srs/*.srs sing-box/json/**/*.json sing-box/logs/*.log"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

      - name: Commit Logs on Failure
        if: failure()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[log] update failed, saving logs"
          file_pattern: "sing-box/logs/*.log"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
