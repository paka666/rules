name: Update srs rules daily

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
# push:
#   branches:
#     - main
#   paths:
#     - '.github/workflows/update-srs-rules.yml'
#     - 'sing-box/merge-srs.sh'
#     - 'sing-box/json/**/*.json'
#     - 'sing-box/srs/*.srs'

jobs:
  merge:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare log directory
        run: mkdir -p sing-box/logs

      - name: Enable QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

#     - name: Set up Python 3.12
#       uses: actions/setup-python@v5
#       with:
#         python-version: '3.12'
#         cache: 'pip'
#         cache-dependency-path: '**/requirements.txt'
#         curl -fsSL https://sing-box.app/install.sh | sh

      - name: Run merge inside Ubuntu ARM64 container
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD":/work \
            -w /work \
            ubuntu:22.04 bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends libgcc-s1 curl wget ca-certificates jq python3 musl file
              echo "=== 环境检查 ==="
              uname -a
              python3 --version
              install -m 755 sing-box/core/sing-box* /usr/local/bin/sing-box
              file /usr/local/bin/sing-box
              sing-box version
              echo "=== 执行 merge-srs.sh ==="
              chmod +x sing-box/merge-srs.sh
              bash sing-box/merge-srs.sh
              echo "=== merge-srs.sh 执行完成 ==="
            '

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs-${{ github.run_number }}
          path: sing-box/logs
          retention-days: 7
          if-no-files-found: warn

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[auto] chore: update srs rules daily"
          file_pattern: "sing-box/srs/*.srs sing-box/json/**/*.json"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
