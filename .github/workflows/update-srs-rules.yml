name: Update srs rules daily

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
#  push:
#    branches:
#      - main
#    paths:
#      - '.github/workflows/update-srs-rules.yml'
#      - 'sing-box/merge-srs.sh'
#      - 'sing-box/json/**/*.json'
#      - 'sing-box/srs/*.srs'

jobs:
  merge:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
#          cache: 'pip'
#          cache-dependency-path: '**/requirements.txt'

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq  #libre2-dev

      - name: Install sing-box
        run: |
          curl -fsSL https://sing-box.app/install.sh | sh

#      - name: Install Python dependencies
#        run: |
#          python -m pip install --upgrade pip
#          pip install -r py/requirements.txt

      - name: Run merge script
        run: |
          chmod +x sing-box/merge-srs.sh
          bash sing-box/merge-srs.sh

      - name: Upload Artifacts (Logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: sing-box/logs

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[auto] chore: update srs rules daily"
          file_pattern: "sing-box/srs/*.srs sing-box/json/**/*.json"
          skip_dirty_check: false
          skip_fetch: true
