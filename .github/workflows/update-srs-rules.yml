name: Update srs rules daily

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
# push:
#   branches:
#     - main
#   paths:
#     - '.github/workflows/update-srs-rules.yml'
#     - 'sing-box/merge-srs.sh'
#     - 'sing-box/json/**/*.json'
#     - 'sing-box/srs/*.srs'

jobs:
  merge:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare log directory
        run: mkdir -p sing-box/logs

      - name: Enable QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
#         cache: 'pip'
#         cache-dependency-path: '**/requirements.txt'

#     - name: Install Python dependencies
#       run: |
#         python -m pip install --upgrade pip
#         pip install -r py/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq p7zip-full qemu-user-static wget
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install ARM64 musl runtime libraries
        run: |
          # 下载并安装 musl (提供 libc.so 和 ld-musl-aarch64.so.1)
          wget https://dl-cdn.alpinelinux.org/alpine/edge/main/aarch64/musl-1.2.5-r21.apk -O musl.apk
          7z x musl.apk -so | sudo tar -xf - -C /
          # 下载并安装 libgcc (提供 libgcc_s.so.1)
          wget https://dl-cdn.alpinelinux.org/alpine/edge/main/aarch64/libgcc-14.2.0-r4.apk -O libgcc.apk
          7z x libgcc.apk -so | sudo tar -xf - -C /
          # 验证安装
          echo "=== 验证依赖库 ==="
          ls -lh /lib/ld-musl-aarch64.so.1 2>/dev/null || echo "❌ musl 链接器缺失"
          ls -lh /lib/libgcc_s.so.1 2>/dev/null || ls -lh /usr/lib/libgcc_s.so.1 2>/dev/null || echo "❌ libgcc_s 缺失"

      - name: Setup sing-box binary
        run: |
          sudo mkdir -p /usr/local/bin
          sudo cp sing-box/core/sing-box1.12.12-r36 /usr/local/bin/sing-box-arm64
          sudo chmod +x /usr/local/bin/sing-box-arm64
#         curl -fsSL https://sing-box.app/install.sh | sh

      - name: Display sing-box info
        run: |
          echo "=== sing-box 二进制信息 ==="
          file /usr/local/bin/sing-box-arm64
          echo ""
          echo "=== sing-box 动态库依赖 ==="
          readelf -d /usr/local/bin/sing-box-arm64 | grep NEEDED

      - name: Test sing-box with QEMU
        run: |
          echo "=== 测试 sing-box 运行 ==="
          qemu-aarch64-static /usr/local/bin/sing-box-arm64 version 2>&1 || {
            echo "⚠️ 首次测试失败，尝试设置 LD_LIBRARY_PATH..."
            export LD_LIBRARY_PATH=/lib:/usr/lib
            qemu-aarch64-static /usr/local/bin/sing-box-arm64 version
          }

      - name: Create sing-box wrapper script
        run: |
          sudo tee /usr/local/bin/sing-box > /dev/null <<'EOF'
          #!/bin/bash
          # Wrapper script to run ARM64 musl sing-box with QEMU
          exec qemu-aarch64-static /usr/local/bin/sing-box-arm64 "$@"
          EOF
          sudo chmod +x /usr/local/bin/sing-box

      - name: Verify sing-box wrapper
        run: |
          echo "=== 验证 sing-box 版本 ==="
          sing-box version

      - name: Run merge script
        run: |
          chmod +x sing-box/merge-srs.sh
          bash sing-box/merge-srs.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs-${{ github.run_number }}
          path: sing-box/logs
          retention-days: 7
          if-no-files-found: warn

      - name: Sync before commit
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[auto] chore: update srs rules daily"
          file_pattern: "sing-box/srs/*.srs sing-box/json/**/*.json"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
