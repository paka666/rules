name: Update srs rules daily

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
# push:
#   branches:
#     - main
#   paths:
#     - '.github/workflows/update-srs-rules.yml'
#     - 'sing-box/merge-srs.sh'
#     - 'sing-box/json/**/*.json'
#     - 'sing-box/srs/*.srs'

jobs:
  merge:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up QEMU (for running ARM64 containers)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
#         cache: 'pip'
#         cache-dependency-path: '**/requirements.txt'
#         curl -fsSL https://sing-box.app/install.sh | sh

      - name: Run merge inside Alpine ARM64 container
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD":/work \
            -w /work \
            alpine:latest sh -e -c '
              set -e
              uname -a
              apk add --no-cache bash jq python3 curl libgcc coreutils file
              install -m 755 sing-box/core/sing-box* /usr/local/bin/sing-box
              file /usr/local/bin/sing-box
              chmod +x /usr/local/bin/sing-box
              sing-box version
              echo "=== 执行 merge-srs.sh ==="
              chmod +x sing-box/merge-srs.sh
              bash sing-box/merge-srs.sh
              echo "=== merge-srs.sh 执行完成 ==="
            '

      - name: Upload artifacts (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs-${{ github.run_number }}
          path: sing-box/logs
          retention-days: 7
          if-no-files-found: warn

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[auto] chore: update srs rules daily"
          file_pattern: "sing-box/srs/*.srs sing-box/json/**/*.json"
          skip_dirty_check: false
          skip_fetch: true
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
